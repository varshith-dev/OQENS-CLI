<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — OQENS CLI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
        .container{width:100%;max-width:420px;padding:24px}
        .card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:40px 36px;box-shadow:0 4px 24px rgba(0,0,0,0.06)}
        .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px}
        .logo-icon{width:36px;height:36px;border-radius:10px;background:#0891b2;display:flex;align-items:center;justify-content:center}
        .logo-icon svg{color:#fff}
        .logo-text{font-weight:800;font-size:20px;letter-spacing:-.02em}
        .subtitle{text-align:center;color:#6b7280;font-size:14px;margin-bottom:28px;line-height:1.5}
        .subtitle strong{color:#1a1a1a}
        .form-group{margin-bottom:18px}
        label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
        input{width:100%;padding:12px 16px;border:1px solid #e5e7eb;border-radius:12px;font-size:15px;font-family:'Inter',sans-serif;background:#fafafa;transition:all .2s;outline:none}
        input:focus{border-color:#0891b2;box-shadow:0 0 0 3px rgba(8,145,178,.1);background:#fff}
        input::placeholder{color:#9ca3af}
        .btn-login{width:100%;padding:13px;border:none;border-radius:12px;background:#1a1a1a;color:#fff;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;margin-top:6px}
        .btn-login:hover{background:#333}
        .btn-login:disabled{background:#9ca3af;cursor:not-allowed}
        .btn-login.loading{position:relative;color:transparent}
        .btn-login.loading::after{content:'';position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:#9ca3af;font-size:13px}
        .divider::before,.divider::after{content:'';flex:1;height:1px;background:#e5e7eb}
        .btn-oauth{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;font-size:14px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px;color:#374151;margin-bottom:10px}
        .btn-oauth:hover{background:#f9fafb;border-color:#d1d5db}
        .btn-oauth svg{width:18px;height:18px}
        .error-msg{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
        .error-msg.show{display:block}
        .footer-text{text-align:center;margin-top:24px;font-size:13px;color:#9ca3af}
        .footer-text a{color:#0891b2;text-decoration:none;font-weight:500}
        .footer-text a:hover{text-decoration:underline}
        .cli-badge{text-align:center;margin-bottom:20px}
        .cli-badge span{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:#ecfeff;color:#0891b2;font-size:12px;font-weight:600;border:1px solid rgba(8,145,178,.12)}
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="cli-badge"><span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                CLI Authentication
            </span></div>

            <div class="logo">
                <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></div>
                <div class="logo-text">OQENS CLI</div>
            </div>

            <p class="subtitle">Sign in to your <strong>OQENS</strong> account to authenticate the CLI.</p>

            <div class="error-msg" id="errorMsg"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login" id="loginBtn">Sign in</button>
            </form>

            <div class="divider">or continue with</div>

            <button class="btn-oauth" onclick="oauthLogin('google')">
                <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Google
            </button>
            <button class="btn-oauth" onclick="oauthLogin('github')">
                <svg viewBox="0 0 24 24" fill="#333"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                GitHub
            </button>
        </div>

        <p class="footer-text">
            Don't have an account? <a href="https://oqens.me/signup">Sign up on OQENS</a>
        </p>
    </div>

    <script>
        const API = 'https://oqens.me/api';
        const params = new URLSearchParams(window.location.search);
        const returnTo = params.get('returnTo');

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
        }
        function hideError() {
            document.getElementById('errorMsg').classList.remove('show');
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideError();
            const btn = document.getElementById('loginBtn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) { showError('Please enter both email and password.'); return; }

            btn.disabled = true;
            btn.classList.add('loading');
            btn.textContent = 'Signing in...';

            try {
                // 1. Login to get JWT
                const res = await fetch(API + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.status !== 'success' || !data.session?.accessToken) {
                    throw new Error(data.message || 'Login failed');
                }

                const jwt = data.session.accessToken;

                // 2. If CLI callback, generate a secure API key
                if (returnTo && returnTo.startsWith('http://localhost:')) {
                    btn.textContent = 'Generating secure token...';

                    const tokenRes = await fetch(API + '/auth/cli-token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + jwt
                        }
                    });
                    const tokenData = await tokenRes.json();

                    if (tokenData.status === 'success' && tokenData.token) {
                        window.location.href = returnTo + '?token=' + tokenData.token;
                    } else {
                        // Fallback to JWT
                        window.location.href = returnTo + '?token=' + jwt;
                    }
                } else {
                    // No CLI callback, redirect to main app
                    window.location.href = 'https://oqens.me';
                }
            } catch (err) {
                showError(err.message || 'Something went wrong. Please try again.');
                btn.disabled = false;
                btn.classList.remove('loading');
                btn.textContent = 'Sign in';
            }
        }

        function oauthLogin(provider) {
            const rto = returnTo || 'https://cli.oqens.me';
            window.location.href = API.replace('/api', '') + '/auth/' + provider + '?returnTo=' + encodeURIComponent(rto) + '&mode=login';
        }
    </script>
</body>
</html>
